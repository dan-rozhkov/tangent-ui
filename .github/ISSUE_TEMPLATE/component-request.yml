name: Component request
description: Propose a new component or block before building it.
title: "Component: "
labels: ["component-request"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: What would the component be called?
      placeholder: Date range picker
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you build today? Say why the existing components don't cover it.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: How should it look and move? Cover states, gestures, keyboard and reduced motion.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links, screenshots or recordings of similar behavior.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Signature
        - Actions
        - Inputs
        - Disclosure
        - Data
        - Feedback
        - Text
        - Special
        - Blocks
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Can you build it?
      options:
        - "Yes"
        - With help
        - No
    validations:
      required: true
