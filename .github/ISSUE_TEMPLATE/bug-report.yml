name: Bug report
description: Something looks or behaves wrong.
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: The name as it appears in the gallery or registry.
      placeholder: button
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
    validations:
      required: true
  - type: input
    id: accent
    attributes:
      label: Accent
      description: The accent selected in the header, or "n/a".
  - type: dropdown
    id: reduced-motion
    attributes:
      label: Reduced motion
      options:
        - "Off"
        - "On"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Safari 19 on iOS 27
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include a link to the gallery page or a minimal snippet.
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
      description: Screenshots or recordings help.
    validations:
      required: true
